<!doctype html>
<html lang="en" class="h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BrachNha — Bac II AI Mentor</title>
    <meta
      name="description"
      content="AI-powered Bac II exam prep for Cambodian Grade 12 students"
    />
    <!-- Single value, not a prefers-color-scheme pair: the app has its own
         theme setting and deliberately does NOT follow the OS, so a media-based
         pair would tint the browser chrome dark while the page renders light.
         The script below keeps this in sync with the real theme. -->
    <meta name="theme-color" content="#faf5ff" />

    <!--
      Applies the saved theme BEFORE first paint. The store hydrates from
      localStorage synchronously, but AppShell's effect only runs after the
      first frame — without this, choosing dark would flash light for a frame on
      every load. Must stay inline and blocking; a module script would be
      deferred and defeat the point. Light is the default, so only an explicit
      "dark" opts in. classList.add rather than className: <html> already
      carries h-full and antialiased.

      The `version >= 2` guard mirrors the store's v1 → v2 migration. Dark was
      briefly the default and is still sitting in older payloads; without the
      guard this would paint dark and then snap to light once the migration
      runs, which is the exact flash the script exists to prevent.
    -->
    <script>
      (function () {
        var dark = false;
        try {
          var saved = JSON.parse(localStorage.getItem("brachnha") || "{}");
          dark =
            !!saved.state &&
            saved.state.theme === "dark" &&
            saved.version >= 2;
        } catch (e) {
          // Private mode, disabled storage, or corrupt JSON — fall back to the
          // default theme rather than blocking the app from booting.
          dark = false;
        }
        document.documentElement.classList.toggle("dark", dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#100e18" : "#faf5ff");
      })();
    </script>

    <!--
      next/font/google used to self-host these and hand the app CSS variables.
      Vite has no equivalent, so we load them from Google Fonts and define the
      same four variables in src/styles/globals.css. Preconnect matters here:
      the audience is on Cambodian mobile data, and it saves a round trip.

      Noto Sans Khmer is not optional decoration — neither Nunito nor Space
      Grotesk ships Khmer glyphs, so without it every Khmer string falls back
      to whatever the device happens to have. Caveat is only for the typed
      signature on the commitment pledge.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Noto+Sans+Khmer:wght@400..800&family=Nunito:wght@400..900&family=Space+Grotesk:wght@500..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
